[project]
name = "rerank-eval"
version = "0.1.0"
description = "Does reranking vector-search candidates with Jev actually help? A frozen, reproducible evaluation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.2"]
llm = ["openai>=3.22"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rerank_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
